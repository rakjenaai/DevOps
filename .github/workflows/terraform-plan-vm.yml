name: Terraform PLAN - VM

on:
  pull_request:
    paths:
      - "infra-repo/terraform/resource-group/vm/**"

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ vars.PLAN_CLIENT_ID2 }}

concurrency:
  group: terraform-plan-vm-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  terraform-plan:

    name: Terraform PLAN - VM

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra-repo/terraform/resource-group/vm

    steps:

      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Generate Terraform PLAN
      - name: Terraform Plan
        run: terraform plan -input=false
        env:
          # SSH public key used by the VM
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}