name: Terraform PLAN

on:

  # ============================================================
  # Automatic PLAN for Pull Requests
  # ============================================================
  pull_request:
    paths:
      - "infra-repo/terraform/resource-group/**"

  # ============================================================
  # Manual PLAN
  # GitHub Actions -> Terraform PLAN -> Run workflow
  # ============================================================
  workflow_dispatch:


# ============================================================
# GitHub permissions
# ============================================================
permissions:
  id-token: write
  contents: read


# ============================================================
# Azure authentication
# ============================================================
env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}


# ============================================================
# Cancel older PLAN when a newer PLAN is started
# ============================================================
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:

  # ============================================================
  # JOB 1
  # Detect changed Terraform components
  # ============================================================
  detect-components:

    name: Detect Terraform Components

    runs-on: ubuntu-latest

    outputs:
      components: ${{ steps.detect.outputs.components }}

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Detect changed Terraform components
      # --------------------------------------------------------
      - name: Detect changed Terraform components
        id: detect
        shell: bash

        run: |

          set -euo pipefail

          echo "GitHub event: ${{ github.event_name }}"


          # ======================================================
          # Pull Request
          # ======================================================
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then

            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"

            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"

            changed_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")


          # ======================================================
          # Manual workflow execution
          #
          # Since manual execution has no PR context,
          # plan all Terraform components.
          # ======================================================
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            echo "Manual workflow execution."
            echo "Planning all Terraform components."

            changed_files=$(
              find infra-repo/terraform/resource-group \
                -type f \
                \( -name "*.tf" -o -name "*.tfvars" \)
            )

          fi


          # ======================================================
          # Display changed files
          # ======================================================
          echo ""
          echo "Changed files:"
          echo "----------------------------"
          echo "$changed_files"
          echo "----------------------------"


          # ======================================================
          # Component array
          # ======================================================
          components=()


          # ======================================================
          # Process changed files
          # ======================================================
          while IFS= read -r file; do

            [[ -z "$file" ]] && continue


            # Ignore files outside Terraform root
            if [[ "$file" != infra-repo/terraform/resource-group/* ]]; then
              continue
            fi


            relative_path="${file#infra-repo/terraform/resource-group/}"


            # ====================================================
            # Root Terraform files
            #
            # Example:
            # resource-group/main.tf
            # resource-group/providers.tf
            # resource-group/backend.tf
            # ====================================================
            if [[ "$relative_path" != */* ]]; then

              case "$relative_path" in

                *.tf|*.tfvars|*.tfvars.json)
                  components+=("resource-group")
                  ;;

              esac

              continue

            fi


            # ====================================================
            # Extract component directory
            # ====================================================
            component="${relative_path%%/*}"


            # ====================================================
            # Supported Terraform components
            # ====================================================
            case "$component" in

              acr)
                components+=("acr")
                ;;

              vnet)
                components+=("vnet")
                ;;

              subnet)
                components+=("subnet")
                ;;

              vm)
                components+=("vm")
                ;;

              vmss)
                components+=("vmss")
                ;;

              aks)
                components+=("aks")
                ;;

              keyvault)
                components+=("keyvault")
                ;;

              *)
                echo "Ignoring unsupported Terraform path: $file"
                ;;

            esac

          done <<< "$changed_files"


          # ======================================================
          # No supported components
          # ======================================================
          if [[ ${#components[@]} -eq 0 ]]; then

            echo 'components=[]' >> "$GITHUB_OUTPUT"

            echo "No supported Terraform components changed."

            exit 0

          fi


          # ======================================================
          # Remove duplicate components
          # ======================================================
          mapfile -t unique_components < <(
            printf '%s\n' "${components[@]}" |
            sort -u
          )


          echo ""
          echo "Detected components:"
          printf '%s\n' "${unique_components[@]}"


          # ======================================================
          # Create Terraform matrix
          # ======================================================
          components_json=$(
            printf '%s\n' "${unique_components[@]}" |
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
              | map(
                  {
                    component: .,
                    working_directory: (
                      if . == "resource-group"
                      then
                        "infra-repo/terraform/resource-group"
                      else
                        "infra-repo/terraform/resource-group/" + .
                      end
                    )
                  }
                )
            '
          )


          echo ""
          echo "Terraform matrix:"
          echo "$components_json"


          # Send matrix to next job
          echo "components=$components_json" >> "$GITHUB_OUTPUT"


  # ============================================================
  # JOB 2
  # Terraform PLAN
  # ============================================================
  terraform-plan:

    name: Terraform Plan - ${{ matrix.component.component }}

    needs:
      - detect-components

    if: needs.detect-components.outputs.components != '[]'

    runs-on: ubuntu-latest


    # ==========================================================
    # Run components independently
    # ==========================================================
    strategy:

      fail-fast: false

      matrix:
        component: ${{ fromJSON(needs.detect-components.outputs.components) }}


    # ==========================================================
    # PLAN Managed Identity
    # ==========================================================
    env:
      ARM_CLIENT_ID: ${{ vars.PLAN_CLIENT_ID }}


    # ==========================================================
    # Terraform working directory
    # ==========================================================
    defaults:
      run:
        working-directory: ${{ matrix.component.working_directory }}


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # Format check
      # --------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # --------------------------------------------------------
      # Initialize Terraform
      # --------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false


      # --------------------------------------------------------
      # Validate Terraform
      # --------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------------
      # Terraform PLAN
      # --------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -input=false
