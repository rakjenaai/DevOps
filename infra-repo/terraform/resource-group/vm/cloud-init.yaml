#cloud-config

# Update the Ubuntu package repository
package_update: true

# Install packages required before Docker installation
packages:
  # Required certificates for HTTPS repositories
  - ca-certificates

  # Used to download Docker repository files
  - curl

runcmd:

  # Create the directory for APT repository signing keys
  - install -m 0755 -d /etc/apt/keyrings

  # Download Docker's official GPG signing key
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc

  # Make the Docker signing key readable by APT
  - chmod a+r /etc/apt/keyrings/docker.asc

  # Add the official Docker repository
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list

  # Refresh APT package information
  - apt-get update

  # Install Docker Engine and Docker Compose
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Configure Docker to start automatically during VM boot
  - systemctl enable docker

  # Start Docker immediately
  - systemctl start docker

  # Allow azureuser to run Docker without sudo after re-login
  - usermod -aG docker azureuser

  # Create directory for our Docker Compose application
  - mkdir -p /opt/docker-app

  # Create the Docker Compose file
  - |
    cat > /opt/docker-app/compose.yaml <<'EOF'
    services:

      # NGINX web application
      web:

        # Docker image used by the container
        image: nginx:1.27

        # Fixed container name
        container_name: demo-web

        # Automatically restart unless manually stopped
        restart: unless-stopped

        # Map VM port 80 to container port 80
        ports:
          - "80:80"
    EOF

  # Start the Docker Compose application
  - cd /opt/docker-app && docker compose up -d